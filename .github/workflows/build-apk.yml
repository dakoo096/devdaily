name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch: # Permite compilar manualmente desde el panel de GitHub

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: devdaily/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd devdaily
          npm install

      - name: Create .env file
        run: |
          cd devdaily
          echo "VITE_GOOGLE_CLIENT_ID=412889617967-m4bdgsiv0buvlpnraveg6f7c9unv9dmd.apps.googleusercontent.com" > .env
          echo "VITE_FACEBOOK_APP_ID=4248072952123673" >> .env
          echo "VITE_API_URL=https://devdaily-production.up.railway.app" >> .env

      - name: Build Vue App
        run: |
          cd devdaily
          npm run build

      - name: Sync Capacitor
        run: |
          cd devdaily
          npx cap add android || true
          cp assets/icon.png assets/splash.png || true
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd devdaily/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevDaily-APK
          path: devdaily/android/app/build/outputs/apk/debug/app-debug.apk
