services:
  # ==============================================================================
  # Database Service — PostgreSQL 16
  # ==============================================================================
  db:
    container_name: devbloom-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devdaily}
      POSTGRES_USER: ${POSTGRES_USER:-devbloom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devbloom_pass_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-devbloom_user} -d $${POSTGRES_DB:-devdaily}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - devbloom-network

  # ==============================================================================
  # Backend API — Spring Boot 3 + Java 21
  # ==============================================================================
  backend:
    container_name: devbloom-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/devdaily}
      DB_USERNAME: ${DB_USERNAME:-devbloom_user}
      DB_PASSWORD: ${DB_PASSWORD:-devbloom_pass_local}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devbloom-network

  # ==============================================================================
  # Frontend — Vue 3 + Ionic 8 + Vite (Desarrollo con Hot-Reload)
  # ==============================================================================
  frontend:
    container_name: devbloom-frontend
    build:
      context: ./devdaily
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_BASE_URL: ${VITE_BASE_URL:-/}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./devdaily:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - devbloom-network

volumes:
  db_data:
    driver: local

networks:
  devbloom-network:
    driver: bridge
