spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/devdaily}
    username: ${DB_USERNAME:devbloom_user}
    password: ${DB_PASSWORD:devbloom_pass_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false

# Application Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
